name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Unit tests. No Databricks credentials are needed: the WorkspaceClient is
  # created on first tool call, and the tests mock it.
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up uv
        # setup-uv publishes no floating major tag (no @v10), so pin a release.
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "latest"
          enable-cache: true

      - name: Install Python
        run: uv python install 3.11

      - name: Install dependencies (from uv.lock)
        run: uv sync --group dev --locked --python 3.11

      - name: Run tests
        # Fail in 5 minutes instead of hanging until the job timeout; faulthandler
        # dumps every thread's stack after 120 s in one test. On failure the last
        # lines become annotations, which can be read without downloading logs.
        run: |
          set -o pipefail
          timeout -s INT 300 uv run --no-sync pytest tests/ -v \
            -o faulthandler_timeout=120 2>&1 | tee pytest.log

      - name: Report the end of the test log
        if: failure()
        # GitHub keeps only 10 annotations per step, so send two multi-line ones:
        # the last tests started, and the start of faulthandler's stack dump.
        run: |
          enc() { sed -e 's/%/%25/g' | awk '{printf "%s%%0A", $0}'; }
          echo "::warning title=last tests::$(grep -E '^tests/.*::' pytest.log | tail -n 5 | enc)"
          echo "::warning title=stack dump::$(grep -m1 -A 60 'Timeout (' pytest.log | enc)"

  # Separate job so lint/format findings never block the tests.
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up uv
        # setup-uv publishes no floating major tag (no @v10), so pin a release.
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "latest"
          enable-cache: true

      - name: Install Python
        run: uv python install 3.11

      - name: Install dependencies (from uv.lock)
        run: uv sync --group dev --locked --python 3.11

      - name: Lint
        run: uv run --no-sync ruff check .

      - name: Format check
        run: uv run --no-sync ruff format --check .
