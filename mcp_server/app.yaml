command:
  - /bin/sh
  - -c
  - "export PYTHONPATH=/app/python/source_code/src:$PYTHONPATH && python -m sru_server.app"
env:
  - name: SERVING_ENDPOINT
    valueFrom: serving-endpoint
  - name: AGENT_TIMEOUT_SECONDS
    value: "300"
  - name: MODEL_SERVICE
    valueFrom: model-service
  # Databricks-hosted serving endpoint the app's agent uses instead of MODEL_SERVICE (whose OpenAI
  # key expired 2026-11-20). Remove this to go back to the Unity Gateway model service.
  - name: AGENT_MODEL
    value: "databricks-gpt-5-6-luna"
  - name: MLFLOW_EXPERIMENT_ID
    valueFrom: app-experiment
  # Function first: run users.amanda_xu.build_sru_url on this warehouse; ask the agent
  # only if that call fails. The app's service principal needs CAN USE on the warehouse
  # and EXECUTE on the function (resources sql-warehouse and sru-function in databricks.yml).
  - name: SQL_WAREHOUSE_ID
    value: "50d2bd4ddf65e0f5"
