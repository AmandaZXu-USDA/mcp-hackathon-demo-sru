[project]
name = "mcp-sru-syntax"
version = "0.1.0"
description = "NAL SRU Syntax MCP server: correction titles to Alma SRU search URLs"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "mcp>=1.10.0,<2",
    "databricks-sdk>=0.50.0",
    "uvicorn>=0.30.0",
    "requests>=2.31.0",
    "openai-agents>=0.25.0",
    "databricks-openai>=0.17.0",
    "mlflow>=3.14.0",
]

[project.scripts]
mcp-sru-syntax = "sru_server.app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sru_server"]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.6.0",
    # eval/phoenix harness (versions from .agents/skills/mcp-eval/SKILL.md)
    "arize-phoenix>=18.0.0",
    "arize-phoenix-client>=2.13.0",
    "arize-phoenix-evals>=3.1.1",
    "langchain>=1.3.14",
    "langchain-mcp-adapters>=0.3.0",
    "langchain-openai>=1.3.5",
    "openinference-instrumentation-langchain>=0.1.67",
    "opentelemetry-exporter-otlp>=1.43.0",
    "opentelemetry-sdk>=1.43.0",
    "pandas>=2.0.0",
    "python-dotenv>=1.0.0",
    "pyyaml>=6.0.0",
]

[tool.uv]
# On Python < 3.12, databricks-connect (via databricks-openai -> unitycatalog-ai) keeps
# numpy at 1.26, and pyarrow 22+ needs numpy 2: importing it fails. pyarrow is imported
# by the eval/phoenix packages and by their pytest plugins (phoenix, langsmith).
# arize-phoenix 19.18+ does not import on Python 3.11 (a dataclass field with a
# mappingproxy default); 19.17 does. Its pytest plugin imports it in every test run.
constraint-dependencies = [
    "pyarrow<22; python_full_version < '3.12'",
    "arize-phoenix<19.18; python_full_version < '3.12'",
]

[tool.ruff]
line-length = 88
target-version = "py311"
exclude = [".venv", ".agents"]
extend-exclude = [
    "*.md",
    # Databricks notebook source exports (contain %pip magics, so they are not valid
    # Python modules). build_evaluation_report.py is regenerated from the workspace
    # notebook "SRU Syntax MCP Evaluation Report"; edit the notebook, not this file.
    "eval/databricks/build_evaluation_report.py",
    "eval/databricks/inspector_gadget_mcp_test.py",
    # Project 2 (mcp-erratum-note + agent-erratum-annotator) is kept byte-identical to the
    # source the live app is deployed from (AmandaZXu-USDA/NAL, erratum-annotator/), so it
    # is not reformatted here. Its notebooks are Databricks source exports.
    "erratum-annotator",
    # Byte-identical copy of the deployed mcp-sru-syntax source (AmandaZXu-USDA/NAL, sru-syntax-mcp/).
    "sru-syntax-mcp",
]

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.ruff.lint.per-file-ignores]
# Long prose docstrings and test-case names; the file is ruff-formatted.
"eval/inspector_gadget/*" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
