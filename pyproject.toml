[project]
name = "sru-syntax-mcp"
version = "0.1.0"
description = "NAL SRU Syntax MCP server: correction titles to Alma SRU search URLs"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "mcp>=1.10.0,<2",
    "databricks-sdk>=0.50.0",
    "uvicorn>=0.30.0",
    "requests>=2.31.0",
    "openai-agents>=0.25.0",
    "databricks-openai>=0.17.0",
    "mlflow>=3.14.0",
]

[project.scripts]
sru-syntax-mcp = "sru_server.app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sru_server"]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.6.0",
]

[tool.ruff]
line-length = 88
target-version = "py311"
exclude = [".venv", ".agents"]
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
