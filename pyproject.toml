[project]
name = "mcp-sru-syntax"
version = "0.1.0"
description = "NAL SRU Syntax MCP server: correction titles to Alma SRU search URLs"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "mcp>=1.10.0,<2",
    "databricks-sdk>=0.50.0",
    "uvicorn>=0.30.0",
    "requests>=2.31.0",
    "openai-agents>=0.25.0",
    "databricks-openai>=0.17.0",
    "mlflow>=3.14.0",
]

[project.scripts]
mcp-sru-syntax = "sru_server.app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sru_server"]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.6.0",
]

[tool.ruff]
line-length = 88
target-version = "py311"
exclude = [".venv", ".agents"]
extend-exclude = [
    "*.md",
    # Databricks notebook source exports (contain %pip magics, so they are not valid
    # Python modules). build_evaluation_report.py is regenerated from the workspace
    # notebook "SRU Syntax MCP Evaluation Report"; edit the notebook, not this file.
    "eval/databricks/build_evaluation_report.py",
    "eval/databricks/inspector_gadget_mcp_test.py",
    # Project 2 (mcp-erratum-note + agent-erratum-annotator) is kept byte-identical to the
    # source the live app is deployed from (AmandaZXu-USDA/NAL, erratum-annotator/), so it
    # is not reformatted here. Its notebooks are Databricks source exports.
    "erratum-annotator",
    # Byte-identical copy of the deployed mcp-sru-syntax source (AmandaZXu-USDA/NAL, sru-syntax-mcp/).
    "sru-syntax-mcp",
]

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.ruff.lint.per-file-ignores]
# Long prose docstrings and test-case names; the file is ruff-formatted.
"eval/inspector_gadget/*" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
